<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр: Молярная масса</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scrollbar-gutter: stable; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh; color: #e0e0e0; padding: 10px;
            user-select: none; overflow-y: scroll;
        }
        .page { max-width: 900px; margin: 0 auto; }
        .nav-links { display: flex; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }
        .nav-links a { color: #00d2ff; text-decoration: none; font-size: 0.95em; opacity: 0.8; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }
        h1 {
            text-align: center; font-size: 1.35em; margin-bottom: 2px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; font-size: 0.78em; margin-bottom: 8px; }

        .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .tab {
            padding: 4px 12px; border-radius: 16px; font-size: 0.75em; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #888;
            transition: all 0.2s;
        }
        .tab:hover { background: rgba(255,255,255,0.08); }
        .tab.active { background: rgba(0,210,255,0.15); border-color: #00d2ff; color: #00d2ff; }

        .progress-row { display: flex; gap: 3px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
        .dot {
            width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); transition: all 0.3s;
        }
        .dot.done { background: #00e676; border-color: #00e676; }
        .dot.fail { background: #ff5252; border-color: #ff5252; }
        .dot.cur { border-color: #00d2ff; box-shadow: 0 0 6px rgba(0,210,255,0.5); }

        .top-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 8px; flex-wrap: wrap; }
        .task-card {
            flex: 1 1 220px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 10px 16px; text-align: center;
        }
        .task-label { font-size: 0.7em; color: #888; margin-bottom: 2px; }
        .task-formula { font-size: 1.6em; font-weight: 700; color: #00d2ff; line-height: 1.4; }
        .task-formula .fname { color: #00d2ff; }

        /* Interactive formula parts */
        .f-el { color: #00d2ff; }
        .f-sub {
            color: #ff9800; cursor: pointer; font-size: 0.65em; vertical-align: sub;
            padding: 1px 3px; border-radius: 4px; border: 1px solid transparent;
            transition: all 0.15s; font-weight: 700; position: relative; top: 2px;
        }
        .f-sub:hover { border-color: #ff9800; background: rgba(255,152,0,0.15); }
        .f-sub:active { transform: scale(0.9); }
        .f-sub.used { border-color: rgba(255,152,0,0.3); background: rgba(255,152,0,0.08); }
        .f-par {
            color: #e040fb; cursor: pointer; font-weight: 400;
            padding: 0 2px; border-radius: 3px; border: 1px solid transparent;
            transition: all 0.15s;
        }
        .f-par:hover { border-color: #e040fb; background: rgba(224,64,251,0.15); }
        .f-par:active { transform: scale(0.9); }
        .f-label { font-size: 0.45em; color: #888; font-weight: 400; vertical-align: baseline; }

        .score-card {
            flex: 0 0 auto; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 10px 16px; text-align: center; display: flex; flex-direction: column; justify-content: center;
        }
        .score-label { font-size: 0.7em; color: #888; }
        .score-val { font-size: 1.2em; font-weight: 700; color: #00d2ff; }

        /* Expression */
        .expr-wrap {
            background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; min-height: 44px;
            display: flex; align-items: center; flex-wrap: wrap; gap: 3px;
            font-size: 1.2em; font-family: 'Consolas', 'Courier New', monospace;
            overflow-x: auto;
        }
        .tok { padding: 1px 3px; border-radius: 4px; white-space: nowrap; }
        .tok-ar { color: #00d2ff; background: rgba(0,210,255,0.1); }
        .tok-sub { color: #ff9800; background: rgba(255,152,0,0.1); }
        .tok-op { color: #999; padding: 0 2px; }
        .tok-par { color: #e040fb; }
        .tok-val { color: #4ade80; background: rgba(74,222,128,0.1); }
        .cursor-blink { display: inline-block; width: 2px; height: 1.1em; background: #00d2ff; animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Operator buttons only */
        .controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
        .ctrl-btn {
            width: 50px; height: 42px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06); color: #ccc; font-size: 1.1em; font-weight: 600;
            cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn.op { color: #ff9800; }
        .ctrl-btn.eq { background: rgba(0,210,255,0.2); border-color: #00d2ff; color: #00d2ff; width: 64px; font-size: 1.15em; }
        .ctrl-btn.eq:hover { background: rgba(0,210,255,0.35); }
        .ctrl-btn.del { color: #ff5252; }
        .ctrl-btn.clr { color: #ff5252; font-size: 0.78em; }

        /* ── Short-form periodic table (Russian style) ── */
        .table-wrap { overflow-x: auto; margin-bottom: 8px; }
        .table-wrap.hidden { display: none; }
        .ptable {
            display: grid;
            grid-template-columns: 30px repeat(7, 1fr) repeat(3, 1fr);
            gap: 2px; min-width: 650px;
        }
        .pt-hdr {
            text-align: center; font-size: 0.65em; font-weight: 700; color: #888;
            padding: 2px 0; display: flex; align-items: center; justify-content: center;
        }
        .pt-hdr.grp { color: #7b2ff7; }
        .pt-per {
            font-size: 0.65em; font-weight: 700; color: #555; display: flex;
            align-items: center; justify-content: center;
        }
        .pcell {
            border: 1px solid rgba(255,255,255,0.08); border-radius: 4px;
            background: rgba(255,255,255,0.03); padding: 0;
            text-align: center; position: relative; min-height: 48px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .pcell .zone-z {
            cursor: pointer; padding: 2px 2px 0; font-size: 0.6em; font-weight: 700;
            color: #ef5350; transition: all 0.15s; border-radius: 3px 3px 0 0; line-height: 1.2;
        }
        .pcell .zone-z:hover { background: rgba(239,83,80,0.2); color: #ff8a80; }
        .pcell .zone-z:active { transform: scale(0.92); }
        .pcell .sym {
            font-size: 0.82em; font-weight: 700; color: #ddd; line-height: 1.1;
            padding: 0 2px; pointer-events: none; flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .pcell .zone-ar {
            cursor: pointer; padding: 0 2px 2px; font-size: 0.6em; font-weight: 700;
            color: #4fc3f7; transition: all 0.15s; border-radius: 0 0 3px 3px; line-height: 1.2;
        }
        .pcell .zone-ar:hover { background: rgba(79,195,247,0.2); color: #81d4fa; }
        .pcell .zone-ar:active { transform: scale(0.92); }
        .pcell.empty { border-color: transparent; background: transparent; pointer-events: none; }
        .pcell.flash .zone-ar { background: rgba(0,210,255,0.3); color: #fff; }
        .pcell.hint { animation: hint-pulse 1.5s ease 3; }
        .pcell.hint-z .zone-z { animation: hint-z-pulse 1s ease 2; }
        @keyframes hint-pulse { 0%,100% { box-shadow: none; } 50% { box-shadow: 0 0 14px rgba(255,82,82,0.6); border-color: #ff5252; } }
        @keyframes hint-z-pulse { 0%,100% { background: transparent; } 50% { background: rgba(239,83,80,0.3); } }

        /* color coding by type */
        .pcell.type-s { border-left: 2px solid rgba(0,210,255,0.3); }
        .pcell.type-p { border-left: 2px solid rgba(255,152,0,0.3); }
        .pcell.type-d { border-left: 2px solid rgba(224,64,251,0.3); }

        /* Feedback */
        .feedback { border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: none; font-size: 0.85em; line-height: 1.6; }
        .feedback.correct { display: block; background: rgba(0,230,118,0.1); border: 1px solid rgba(0,230,118,0.3); }
        .feedback.wrong { display: block; background: rgba(255,82,82,0.1); border: 1px solid rgba(255,82,82,0.3); }
        .feedback .fb-title { font-weight: 700; margin-bottom: 4px; }
        .feedback.correct .fb-title { color: #00e676; }
        .feedback.wrong .fb-title { color: #ff5252; }
        .feedback .fb-breakdown { color: #bbb; }
        .feedback .fb-breakdown b { color: #00d2ff; }
        .fb-next {
            margin-top: 8px; padding: 7px 22px; border-radius: 18px; border: 1px solid #00d2ff;
            background: rgba(0,210,255,0.15); color: #00d2ff; cursor: pointer; font-size: 0.88em; transition: all 0.2s;
        }
        .fb-next:hover { background: rgba(0,210,255,0.3); }

        /* Given cards for two-step tasks */
        .given-cards { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; justify-content: center; }
        .given-card {
            background: rgba(0,210,255,0.08); border: 1px solid rgba(0,210,255,0.3);
            border-radius: 10px; padding: 8px 14px; cursor: pointer; text-align: center;
            transition: all 0.2s; min-width: 80px;
        }
        .given-card:hover { background: rgba(0,210,255,0.15); border-color: #00d2ff; }
        .given-card:active { transform: scale(0.95); }
        .given-card .gc-label { font-size: 0.7em; color: #888; }
        .given-card .gc-value { font-size: 1.1em; font-weight: 700; color: #00d2ff; }
        .given-card .gc-unit { font-size: 0.75em; color: #888; }
        .given-card.stored-m { border-color: #4ade80; }
        .given-card.stored-m .gc-value { color: #4ade80; }
        .step-indicator { text-align: center; font-size: 0.85em; margin: 6px 0; }
        .step-indicator .step-active { color: #00d2ff; font-weight: 700; }
        .step-indicator .step-done { color: #4ade80; }
        .given-area { display: none; }
        .given-area.visible { display: block; }

        /* Problem text */
        .problem-text {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 8px;
            font-size: 0.88em; line-height: 1.5; color: #ccc; display: none;
        }
        .problem-text.visible { display: block; }
        .problem-text b { color: #00d2ff; }

        /* Formula choice for equivalents */
        .formula-choice { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; justify-content: center; }
        .formula-choice.visible { display: flex; }
        .fc-btn {
            padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05); color: #ccc; font-size: 0.82em;
            cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .fc-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }
        .fc-btn.correct { background: rgba(0,230,118,0.15); border-color: #00e676; color: #00e676; }
        .fc-btn.wrong { background: rgba(255,82,82,0.15); border-color: #ff5252; color: #ff5252; }
        .fc-label { text-align: center; font-size: 0.78em; color: #888; margin-bottom: 4px; display: none; }
        .fc-label.visible { display: block; }
    </style>
</head>
<body>
<div class="page">
    <div class="nav-links">

    <h1>Молярная масса</h1>
    <div class="subtitle" id="subtitle">Нажимай на индексы в формуле и элементы в таблице &mdash; собирай выражение</div>

    <div class="tabs" id="tabsRow">

    <div class="progress-row" id="progressRow"></div>

    <div class="top-row">

        <div class="score-card">
            <div class="score-label">Верно</div>
            <div class="score-val"><span id="scoreNum">0</span>/<span id="scoreTotal">0</span></div>
        </div>
    </div>

    <div class="problem-text" id="problemText"></div>

    <div class="step-indicator" id="stepIndicator" style="display:none;"></div>

    <div class="fc-label" id="fcLabel">Выберите формулу эквивалента:</div>
    <div class="formula-choice" id="formulaChoice">
        <button class="fc-btn" data-ft="acid">Э = M / основность<br><span style="font-size:0.8em;color:#888;">кислоты</span></button>
        <button class="fc-btn" data-ft="base">Э = M / число OH&minus;<br><span style="font-size:0.8em;color:#888;">основания</span></button>
        <button class="fc-btn" data-ft="salt">Э = M / (вал.&times;кол.)<br><span style="font-size:0.8em;color:#888;">соли</span></button>
        <button class="fc-btn" data-ft="oxide">Э = M / (вал.&times;кол.)<br><span style="font-size:0.8em;color:#888;">оксиды</span></button>
    </div>

    <div class="given-area" id="givenArea">
        <div class="given-cards" id="givenCards"></div>
    </div>

    <div class="expr-wrap" id="exprWrap"><span class="cursor-blink"></span></div>

    <div class="controls" id="controlsRow">
        <button class="ctrl-btn op" data-o="×">×</button>
        <button class="ctrl-btn op" data-o="+">+</button>
        <button class="ctrl-btn op" data-o="−">−</button>
        <button class="ctrl-btn op" data-o="/">/</button>
        <button class="ctrl-btn op" data-o="(" style="display:none;" id="btnParenL">(</button>
        <button class="ctrl-btn op" data-o=")" style="display:none;" id="btnParenR">)</button>
        <button class="ctrl-btn del" data-act="del">&#9003;</button>
        <button class="ctrl-btn clr" data-act="clr">AC</button>
        <button class="ctrl-btn eq" data-act="eq">=</button>
    </div>

    <div class="table-wrap" id="tableWrap">
        <div class="ptable" id="ptable"></div>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
/* ── Element data ── */
const EL = {};
[
    {z:1,sym:'H',ar:1,t:'s'},{z:2,sym:'He',ar:4,t:'s'},
    {z:3,sym:'Li',ar:7,t:'s'},{z:4,sym:'Be',ar:9,t:'s'},{z:5,sym:'B',ar:11,t:'p'},{z:6,sym:'C',ar:12,t:'p'},{z:7,sym:'N',ar:14,t:'p'},{z:8,sym:'O',ar:16,t:'p'},{z:9,sym:'F',ar:19,t:'p'},{z:10,sym:'Ne',ar:20,t:'p'},
    {z:11,sym:'Na',ar:23,t:'s'},{z:12,sym:'Mg',ar:24,t:'s'},{z:13,sym:'Al',ar:27,t:'p'},{z:14,sym:'Si',ar:28,t:'p'},{z:15,sym:'P',ar:31,t:'p'},{z:16,sym:'S',ar:32,t:'p'},{z:17,sym:'Cl',ar:35.5,t:'p'},{z:18,sym:'Ar',ar:40,t:'p'},
    {z:19,sym:'K',ar:39,t:'s'},{z:20,sym:'Ca',ar:40,t:'s'},{z:21,sym:'Sc',ar:45,t:'d'},{z:22,sym:'Ti',ar:48,t:'d'},{z:23,sym:'V',ar:51,t:'d'},{z:24,sym:'Cr',ar:52,t:'d'},{z:25,sym:'Mn',ar:55,t:'d'},{z:26,sym:'Fe',ar:56,t:'d'},{z:27,sym:'Co',ar:59,t:'d'},{z:28,sym:'Ni',ar:59,t:'d'},{z:29,sym:'Cu',ar:64,t:'d'},{z:30,sym:'Zn',ar:65,t:'d'},{z:31,sym:'Ga',ar:70,t:'p'},{z:32,sym:'Ge',ar:73,t:'p'},{z:33,sym:'As',ar:75,t:'p'},{z:34,sym:'Se',ar:79,t:'p'},{z:35,sym:'Br',ar:80,t:'p'},{z:36,sym:'Kr',ar:84,t:'p'},
    {z:37,sym:'Rb',ar:85,t:'s'},{z:38,sym:'Sr',ar:88,t:'s'},{z:39,sym:'Y',ar:89,t:'d'},{z:40,sym:'Zr',ar:91,t:'d'},{z:41,sym:'Nb',ar:93,t:'d'},{z:42,sym:'Mo',ar:96,t:'d'},{z:43,sym:'Tc',ar:98,t:'d'},{z:44,sym:'Ru',ar:101,t:'d'},{z:45,sym:'Rh',ar:103,t:'d'},{z:46,sym:'Pd',ar:106,t:'d'},{z:47,sym:'Ag',ar:108,t:'d'},{z:48,sym:'Cd',ar:112,t:'d'},{z:49,sym:'In',ar:115,t:'p'},{z:50,sym:'Sn',ar:119,t:'p'},{z:51,sym:'Sb',ar:122,t:'p'},{z:52,sym:'Te',ar:128,t:'p'},{z:53,sym:'I',ar:127,t:'p'},{z:54,sym:'Xe',ar:131,t:'p'}
].forEach(e => EL[e.sym] = e);

/* ── Short-form table layout (Russian style) ── */
const tableRows = [
    { per: '1', cells: ['H', '', '', '', '', '', '', '', '', 'He'] },
    { per: '2', cells: ['Li', 'Be', 'B', 'C', 'N', 'O', 'F', '', '', 'Ne'] },
    { per: '3', cells: ['Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', '', '', 'Ar'] },
    { per: '4', cells: ['K', 'Ca', 'Sc', 'Ti', 'V', 'Cr', 'Mn', 'Fe', 'Co', 'Ni'] },
    { per: '',  cells: ['Cu', 'Zn', 'Ga', 'Ge', 'As', 'Se', 'Br', '', '', 'Kr'] },
    { per: '5', cells: ['Rb', 'Sr', 'Y', 'Zr', 'Nb', 'Mo', 'Tc', 'Ru', 'Rh', 'Pd'] },
    { per: '',  cells: ['Ag', 'Cd', 'In', 'Sn', 'Sb', 'Te', 'I', '', '', 'Xe'] },
];

/* ══════════════════════════════════════════════════════════
   ── TASK DATA FOR ALL MODES ──
   ══════════════════════════════════════════════════════════ */

/* ── Molar mass tasks ── */
const molarTasks = [
    { mr:18, elems:['H','O'], breakdown:'A<sub>r</sub>(H)\u00d72 + A<sub>r</sub>(O) = <b>1</b>\u00d72 + <b>16</b> = 18',
      parts:[{t:'el',v:'H'},{t:'sub',v:'2'},{t:'el',v:'O'}] },
    { mr:44, elems:['C','O'], breakdown:'A<sub>r</sub>(C) + A<sub>r</sub>(O)\u00d72 = <b>12</b> + <b>16</b>\u00d72 = 44',
      parts:[{t:'el',v:'C'},{t:'el',v:'O'},{t:'sub',v:'2'}] },
    { mr:58.5, elems:['Na','Cl'], breakdown:'A<sub>r</sub>(Na) + A<sub>r</sub>(Cl) = <b>23</b> + <b>35.5</b> = 58.5',
      parts:[{t:'el',v:'Na'},{t:'el',v:'Cl'}] },
    { mr:36.5, elems:['H','Cl'], breakdown:'A<sub>r</sub>(H) + A<sub>r</sub>(Cl) = <b>1</b> + <b>35.5</b> = 36.5',
      parts:[{t:'el',v:'H'},{t:'el',v:'Cl'}] },
    { mr:63, elems:['H','N','O'], breakdown:'A<sub>r</sub>(H)+A<sub>r</sub>(N)+A<sub>r</sub>(O)\u00d73 = <b>1</b>+<b>14</b>+<b>16</b>\u00d73 = 63',
      parts:[{t:'el',v:'H'},{t:'el',v:'N'},{t:'el',v:'O'},{t:'sub',v:'3'}] },
    { mr:98, elems:['H','S','O'], breakdown:'A<sub>r</sub>(H)\u00d72+A<sub>r</sub>(S)+A<sub>r</sub>(O)\u00d74 = <b>1</b>\u00d72+<b>32</b>+<b>16</b>\u00d74 = 98',
      parts:[{t:'el',v:'H'},{t:'sub',v:'2'},{t:'el',v:'S'},{t:'el',v:'O'},{t:'sub',v:'4'}] },
    { mr:98, elems:['H','P','O'], breakdown:'A<sub>r</sub>(H)\u00d73+A<sub>r</sub>(P)+A<sub>r</sub>(O)\u00d74 = <b>1</b>\u00d73+<b>31</b>+<b>16</b>\u00d74 = 98',
      parts:[{t:'el',v:'H'},{t:'sub',v:'3'},{t:'el',v:'P'},{t:'el',v:'O'},{t:'sub',v:'4'}] },

let currentMode = 'molar'; // 'molar' | 'concentration' | 'solutions' | 'equivalents'
let tokens = [];
let locked = false;

// Per-mode state
const modeState = {
    molar:         { idx: 0, score: 0, results: [] },
    concentration: { idx: 0, score: 0, results: [], step: 1, storedM: null },
    solutions:     { idx: 0, score: 0, results: [] },
    equivalents:   { idx: 0, score: 0, results: [], step: 1, storedM: null },
};

function getTasksForMode(mode) {
    if (mode === 'molar') return molarTasks;
    if (mode === 'concentration') return concTasks;
    if (mode === 'solutions') return solutionsTasks;
    if (mode === 'equivalents') return equivTasks;
    return [];
}
function ms() { return modeState[currentMode]; }
function curTasks() { return getTasksForMode(currentMode); }
function curTask() { return curTasks()[ms().idx]; }

/* ══════════════════════════════════════════════════════════
   ── BUILD PERIODIC TABLE ──
   ══════════════════════════════════════════════════════════ */
const cellMap = {};
(function buildTable() {
    const pt = document.getElementById('ptable');
    const hdr = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
    hdr.forEach(h => {
        const d = document.createElement('div');
        d.className = 'pt-hdr' + (h ? ' grp' : '');
        d.textContent = h;
        pt.appendChild(d);
    });
    const viii = document.createElement('div');
    viii.className = 'pt-hdr grp';
    viii.textContent = 'VIII';
    viii.style.gridColumn = 'span 3';
    pt.appendChild(viii);

    tableRows.forEach(row => {
        const pCell = document.createElement('div');
        pCell.className = 'pt-per';
        pCell.textContent = row.per;
        pt.appendChild(pCell);

        row.cells.forEach(sym => {
            const cell = document.createElement('div');
            if (!sym) {
                cell.className = 'pcell empty';
                cell.innerHTML = '&nbsp;';
                pt.appendChild(cell);
                return;
            }
            const el = EL[sym];
            cell.className = 'pcell type-' + el.t;
            const zoneZ = document.createElement('div');
            zoneZ.className = 'zone-z';
            zoneZ.textContent = el.z;
            zoneZ.addEventListener('click', () => onZoneClick(el, 'z'));
            const symSpan = document.createElement('div');
            symSpan.className = 'sym';
            symSpan.textContent = el.sym;
            const zoneAr = document.createElement('div');
            zoneAr.className = 'zone-ar';
            zoneAr.textContent = el.ar;
            zoneAr.addEventListener('click', () => onZoneClick(el, 'ar'));
            cell.appendChild(zoneZ);
            cell.appendChild(symSpan);
            cell.appendChild(zoneAr);
            cellMap[sym] = cell;
            pt.appendChild(cell);
        });
    });
})();

/* ══════════════════════════════════════════════════════════
   ── TAB SWITCHING ──
   ══════════════════════════════════════════════════════════ */
document.getElementById('tabsRow').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab || tab.classList.contains('active')) return;
    const mode = tab.dataset.mode;
    if (!mode) return;
    // Switch
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = mode;
    tokens = [];
    locked = false;
    document.getElementById('feedback').className = 'feedback';
    document.querySelectorAll('.pcell.hint').forEach(c => c.classList.remove('hint'));
    // Reset step for two-step modes
    if (ms().step !== undefined) { ms().step = 1; ms().storedM = null; }
    hideFormulaChoice();
    // If mode is complete, restart it
    const st = ms();
    if (st.idx >= getTasksForMode(currentMode).length) {
        st.idx = 0; st.score = 0; st.results = [];
    }
    loadTask();
});

/* ══════════════════════════════════════════════════════════

function updateSubtitle() {
    const el = document.getElementById('subtitle');
    if (currentMode === 'molar') {
        el.textContent = '\u041d\u0430\u0436\u0438\u043c\u0430\u0439 \u043d\u0430 \u0438\u043d\u0434\u0435\u043a\u0441\u044b \u0432 \u0444\u043e\u0440\u043c\u0443\u043b\u0435 \u0438 \u044d\u043b\u0435\u043c\u0435\u043d\u0442\u044b \u0432 \u0442\u0430\u0431\u043b\u0438\u0446\u0435 \u2014 \u0441\u043e\u0431\u0438\u0440\u0430\u0439 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0435';
    } else if (currentMode === 'concentration') {
        el.textContent = '\u0412\u044b\u0447\u0438\u0441\u043b\u0438 M \u0438\u0437 \u0442\u0430\u0431\u043b\u0438\u0446\u044b, \u0437\u0430\u0442\u0435\u043c \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u0430\u0439 \u043c\u043e\u043b\u044f\u0440\u043d\u0443\u044e \u043a\u043e\u043d\u0446\u0435\u043d\u0442\u0440\u0430\u0446\u0438\u044e C = m/(M\u00b7V)';
    } else if (currentMode === 'solutions') {
        el.textContent = '\u041c\u0430\u0441\u0441\u043e\u0432\u0430\u044f \u0434\u043e\u043b\u044f: \u043d\u0430\u0436\u0438\u043c\u0430\u0439 \u043d\u0430 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438 \u0434\u0430\u043d\u043d\u044b\u0445 \u0438 \u0441\u043e\u0431\u0438\u0440\u0430\u0439 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0435';
    } else if (currentMode === 'equivalents') {
        el.textContent = '\u0412\u044b\u0447\u0438\u0441\u043b\u0438 M \u0438\u0437 \u0442\u0430\u0431\u043b\u0438\u0446\u044b, \u0437\u0430\u0442\u0435\u043c \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u0430\u0439 \u044d\u043a\u0432\u0438\u0432\u0430\u043b\u0435\u043d\u0442 \u042d = M/n';
    }
}

function renderFormula() {
    const task = curTask();
    if (!task) return;

    // For solutions mode — no formula
    if (currentMode === 'solutions') {
        document.getElementById('taskFormulaWrap').innerHTML = '\u041c\u0430\u0441\u0441\u043e\u0432\u0430\u044f \u0434\u043e\u043b\u044f \u0440\u0430\u0441\u0442\u0432\u043e\u0440\u0430';
        return;
    }

    let html = '';
    const parts = task.parts;
    parts.forEach((p, i) => {
        if (p.t === 'el') {
            html += '<span class="f-el">' + p.v + '</span>';
        } else if (p.t === 'sub') {
            html += '<span class="f-sub" data-idx="' + i + '" data-val="' + p.v + '">' + p.v + '</span>';
        } else if (p.t === 'par') {
            html += '<span class="f-par" data-idx="' + i + '" data-val="' + p.v + '">' + p.v + '</span>';
        } else if (p.t === 'label') {
            html += ' <span class="f-label">(' + p.v + ')</span>';
        }
    });
    // taskFormulaWrap below will recreate #formula with this html

    // For two-step modes, update the wrapper text
    const st = ms();
    if ((currentMode === 'concentration' || currentMode === 'equivalents') && st.step === 2) {
        // Step 2: show formula with actual numbers (no parentheses needed)
        if (currentMode === 'concentration') {
            // Concentration step 2: show formula with clickable subscripts + M, no spoilers
            document.getElementById('taskFormulaWrap').innerHTML =
                '<span id="formula">' + html + '</span>' +
                '<span style="margin-left:10px;font-size:0.7em;color:#4ade80;">M = ' + st.storedM + '</span>' +
                '<br><span style="font-size:0.75em;color:#888;">C = m / (M \u00b7 V) = ?</span>';
        } else {
            // Equivalents step 2: keep formula with clickable subscripts + M value
            document.getElementById('taskFormulaWrap').innerHTML =
                '<span id="formula">' + html + '</span>' +
                '<span style="margin-left:10px;font-size:0.7em;color:#4ade80;">M = ' + st.storedM + '</span>' +
                '<br><span style="font-size:0.75em;color:#888;">\u042d = M / n = ?</span>';
        }
    } else if (currentMode === 'concentration' || currentMode === 'equivalents') {
        // Step 1
        document.getElementById('taskFormulaWrap').innerHTML = 'M<sub>r</sub>(<span id="formula">' + html + '</span>) = ?';
    } else {
        // Molar mass mode
        document.getElementById('taskFormulaWrap').innerHTML = 'M<sub>r</sub>(<span id="formula">' + html + '</span>) = ?';
    }

    // Re-select the formula element (it was replaced)
    const formulaEl = document.getElementById('formula');
    if (formulaEl) {
        formulaEl.querySelectorAll('.f-sub').forEach(span => {
            span.addEventListener('click', () => {
                if (locked) return;
                tokens.push({ type: 'sub', value: span.dataset.val });
                span.classList.add('used');
                renderExpr();
            });
        });
        formulaEl.querySelectorAll('.f-par').forEach(span => {
            span.addEventListener('click', () => {
                if (locked) return;
                tokens.push({ type: 'par', value: span.dataset.val });
                renderExpr();
            });
        });
    }
}

function renderExpr() {
    const wrap = document.getElementById('exprWrap');
    let html = '';
    tokens.forEach(t => {
        if (t.type === 'ar') html += '<span class="tok tok-ar" title="Ar(' + t.sym + ')">' + t.value + '</span>';
        else if (t.type === 'sub') html += '<span class="tok tok-sub">' + t.value + '</span>';
        else if (t.type === 'par') html += '<span class="tok tok-par">' + t.value + '</span>';
        else if (t.type === 'val') html += '<span class="tok tok-val">' + t.value + '</span>';
        else html += '<span class="tok tok-op">' + t.value + '</span>';
    });
    if (!locked) html += '<span class="cursor-blink"></span>';
    wrap.innerHTML = html;
}

function renderGivenCards() {
    const area = document.getElementById('givenArea');
    const cards = document.getElementById('givenCards');
    const task = curTask();
    const st = ms();

    // Determine if we need given cards
    const isTwoStep = (currentMode === 'concentration' || currentMode === 'equivalents');
    const isSolutions = (currentMode === 'solutions');

    if (isSolutions) {
        // Show given cards directly
        area.classList.add('visible');
        let html = '';
        task.given.forEach((g, i) => {
            html += '<div class="given-card" data-gidx="' + i + '" data-gval="' + g.value + '">' +
                '<div class="gc-label">' + g.label + '</div>' +
                '<div class="gc-value">' + g.value + '</div>' +
                (g.unit ? '<div class="gc-unit">' + g.unit + '</div>' : '') +
                '</div>';
        });
        cards.innerHTML = html;
        attachGivenCardListeners();
    } else if (isTwoStep && st.step === 2) {
        // Step 2: show stored M + given values
        area.classList.add('visible');
        let html = '<div class="given-card stored-m" data-gval="' + st.storedM + '">' +
            '<div class="gc-label">M</div>' +
            '<div class="gc-value">' + st.storedM + '</div>' +
            '</div>';
        task.given.forEach((g, i) => {
            html += '<div class="given-card" data-gidx="' + i + '" data-gval="' + g.value + '">' +
                '<div class="gc-label">' + g.label + '</div>' +
                '<div class="gc-value">' + g.value + '</div>' +
                (g.unit ? '<div class="gc-unit">' + g.unit + '</div>' : '') +
                '</div>';
        });
        cards.innerHTML = html;
        attachGivenCardListeners();
    } else {
        area.classList.remove('visible');
        cards.innerHTML = '';
    }
}

function attachGivenCardListeners() {
    document.querySelectorAll('.given-card').forEach(card => {
        card.addEventListener('click', () => {
            if (locked) return;
            const val = card.dataset.gval;
            tokens.push({ type: 'val', value: val });
            renderExpr();
        });
    });
}

function renderStepIndicator() {
    const el = document.getElementById('stepIndicator');
    const isTwoStep = (currentMode === 'concentration' || currentMode === 'equivalents');
    if (!isTwoStep) {
        el.style.display = 'none';
        return;
    }
    el.style.display = 'block';
    const st = ms();
    const task = curTask();
    if (!task) { el.style.display = 'none'; return; }

    const step2name = currentMode === 'concentration' ? '\u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u044c C' : '\u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u044c \u042d';
    if (st.step === 1) {
        el.innerHTML = '<span class="step-active">\u0428\u0430\u0433 1: M(' + task.substance + ')</span> &rarr; \u0428\u0430\u0433 2: ' + step2name;
    } else {
        el.innerHTML = '<span class="step-done">\u0428\u0430\u0433 1: M = ' + st.storedM + ' \u2713</span> &rarr; <span class="step-active">\u0428\u0430\u0433 2: ' + step2name + '</span>';
    }
}

function updateTableVisibility() {
    const wrap = document.getElementById('tableWrap');
    const st = ms();
    if (currentMode === 'solutions' || ((currentMode === 'concentration' || currentMode === 'equivalents') && st.step === 2)) {
        wrap.classList.add('hidden');
    } else {
        wrap.classList.remove('hidden');
    }
}

function updateParenButtons() {
    const st = ms();
    const show = (currentMode === 'solutions') ||
                 ((currentMode === 'concentration' || currentMode === 'equivalents') && st.step === 2);
    document.getElementById('btnParenL').style.display = show ? '' : 'none';
    document.getElementById('btnParenR').style.display = show ? '' : 'none';
}

function updateScore() {
    const st = ms();
    const tasks = curTasks();
    document.getElementById('scoreNum').textContent = st.score;
    document.getElementById('scoreTotal').textContent = Math.max(st.idx + 1, st.results.length);
}

function renderDots() {
    const row = document.getElementById('progressRow');
    row.innerHTML = '';
    const tasks = curTasks();
    const st = ms();
    tasks.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot';
        if (i === st.idx && !locked) d.classList.add('cur');
        if (st.results[i] === true) d.classList.add('done');
        else if (st.results[i] === false) d.classList.add('fail');
        row.appendChild(d);
    });
}

/* ══════════════════════════════════════════════════════════
   ── ELEMENT CLICK ──
   ══════════════════════════════════════════════════════════ */
function onZoneClick(el, zone) {
    if (locked) return;
    // In solutions mode, periodic table is hidden, but just in case
    if (currentMode === 'solutions') return;
    // In two-step mode step 2, periodic table clicks are ignored
    const st = ms();
    if ((currentMode === 'concentration' || currentMode === 'equivalents') && st.step === 2) return;

    if (zone === 'ar') {
        tokens.push({ type: 'ar', value: String(el.ar), sym: el.sym });
    } else {
        tokens.push({ type: 'ar', value: String(el.z), sym: el.sym + '(Z!)' });
    }
    flashCell(el.sym);
    renderExpr();
}

/* ══════════════════════════════════════════════════════════
   ── CONTROLS ──
   ══════════════════════════════════════════════════════════ */
document.getElementById('controlsRow').addEventListener('click', e => {
    const btn = e.target.closest('.ctrl-btn');
    if (!btn || locked) return;
    const act = btn.dataset.act;
    const op = btn.dataset.o;
    if (op) {
        tokens.push({ type: 'op', value: op });
    } else if (act === 'del') {
        tokens.pop();
    } else if (act === 'clr') {
        tokens = [];
        document.querySelectorAll('.f-sub.used').forEach(s => s.classList.remove('used'));
    } else if (act === 'eq') {
        evaluate();
        return;
    }
    renderExpr();
});

/* ── Keyboard ── */
document.addEventListener('keydown', e => {
    if (locked) { if (e.key === 'Enter') retryTask(); return; }
    if (e.key === '+') { tokens.push({type:'op',value:'+'}); renderExpr(); }
    else if (e.key === '-') { tokens.push({type:'op',value:'\u2212'}); renderExpr(); }
    else if (e.key === '*' || e.key === '\u0445' || e.key === '\u0425') { tokens.push({type:'op',value:'\u00d7'}); renderExpr(); }
    else if (e.key === '/') { tokens.push({type:'op',value:'/'}); renderExpr(); }
    else if (e.key === '(' ) { tokens.push({type:'op',value:'('}); renderExpr(); }
    else if (e.key === ')' ) { tokens.push({type:'op',value:')'}); renderExpr(); }
    else if (e.key === 'Backspace') { tokens.pop(); renderExpr(); }
    else if (e.key === 'Escape') { tokens = []; renderExpr(); document.querySelectorAll('.f-sub.used').forEach(s => s.classList.remove('used')); }
    else if (e.key === 'Enter' || e.key === '=') evaluate();
});

/* ══════════════════════════════════════════════════════════
   ── EVALUATE ──
   ══════════════════════════════════════════════════════════ */
function evaluate() {
    if (tokens.length === 0) return;
    const expr = tokens.map(t => t.value).join(' ').replace(/\u00d7/g, '*').replace(/\u2212/g, '-');
    let result;
    try { result = Function('"use strict"; return (' + expr + ')')(); } catch { showWrong(NaN); return; }
    if (typeof result !== 'number' || isNaN(result)) { showWrong(NaN); return; }

    const task = curTask();
    const st = ms();
    const isTwoStep = (currentMode === 'concentration' || currentMode === 'equivalents');

    if (currentMode === 'molar') {
        // Simple molar mass check
        const rounded = Math.round(result * 10) / 10;
        if (Math.abs(rounded - task.mr) < 0.01) showCorrect(rounded);
        else showWrong(rounded);
    } else if (isTwoStep && st.step === 1) {
        // Step 1: check M — show result, then button to proceed
        const rounded = Math.round(result * 10) / 10;
        if (Math.abs(rounded - task.mr) < 0.01) {
            st.storedM = task.mr;
            locked = true;
            tokens.push({ type: 'op', value: '=' });
            tokens.push({ type: 'val', value: String(rounded) });
            renderExpr();
            const fb = document.getElementById('feedback');
            fb.className = 'feedback correct';
            fb.innerHTML = '<div class="fb-title">\u2713 M(' + task.substance + ') = ' + task.mr + '</div>' +
                '<div class="fb-breakdown">' + task.breakdown + '</div>' +
                '<button class="fb-next" onclick="goStep2()">\u0428\u0430\u0433 2: \u0432\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u044c ' + (currentMode === 'concentration' ? 'C' : '\u042d') + ' &rarr;</button>';
        } else {
            showWrongStep1(rounded);
        }
    } else if (isTwoStep && st.step === 2) {
        // Step 2: check final answer
        const rounded = Math.round(result * 100) / 100;
        if (Math.abs(rounded - task.answer) < (task.tolerance || 0.01)) showCorrect(rounded);
        else showWrong(rounded);
    } else if (currentMode === 'solutions') {
        // Direct check
        const rounded = Math.round(result * 100) / 100;
        if (Math.abs(rounded - task.answer) < (task.tolerance || 0.5)) showCorrect(rounded);
        else showWrong(rounded);
    }
}

function showCorrect(val) {
    locked = true;
    const st = ms();
    st.score++;
    st.results[st.idx] = true;
    updateScore(); renderDots();
    const fb = document.getElementById('feedback');
    fb.className = 'feedback correct';
    const tasks = curTasks();
    const task = curTask();

    let title = '';
    if (currentMode === 'molar') {
        title = '\u2713 \u0412\u0435\u0440\u043d\u043e! M<sub>r</sub> = ' + task.mr;
    } else if (currentMode === 'solutions') {
        title = '\u2713 \u0412\u0435\u0440\u043d\u043e! \u041e\u0442\u0432\u0435\u0442: ' + task.answer;
    } else {
        title = '\u2713 \u0412\u0435\u0440\u043d\u043e! \u041e\u0442\u0432\u0435\u0442: ' + task.answer;
    }

    fb.innerHTML = '<div class="fb-title">' + title + '</div>' +
        (task.explanation ? '<div class="fb-breakdown">' + task.explanation + '</div>' : '') +
        '<button class="fb-next" onclick="nextTask()">' + (st.idx < tasks.length - 1 ? '\u0421\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0435 \u0437\u0430\u0434\u0430\u043d\u0438\u0435 &rarr;' : '\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b &rarr;') + '</button>';
    tokens.push({ type: 'op', value: '=' });
    tokens.push({ type: 'val', value: String(val) });
    renderExpr();
}

function showWrong(val) {
    locked = true;
    const st = ms();
    st.results[st.idx] = false;
    updateScore(); renderDots();
    const task = curTask();
    const tasks = curTasks();
    const fb = document.getElementById('feedback');
    fb.className = 'feedback wrong';
    const valStr = isNaN(val) ? '\u043e\u0448\u0438\u0431\u043a\u0430 \u0432 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0438' : val;

    const usedZ = tokens.some(t => t.sym && t.sym.includes('(Z!)'));
    const zWarn = usedZ ? '<div style="margin-top:6px;font-size:0.82em;color:#ef5350;font-weight:700;">&#9888; \u0422\u044b \u0432\u0437\u044f\u043b(\u0430) \u0437\u0430\u0440\u044f\u0434 \u044f\u0434\u0440\u0430 (\u0432\u0435\u0440\u0445\u043d\u0435\u0435 \u0447\u0438\u0441\u043b\u043e) \u0432\u043c\u0435\u0441\u0442\u043e \u0430\u0442\u043e\u043c\u043d\u043e\u0439 \u043c\u0430\u0441\u0441\u044b (\u043d\u0438\u0436\u043d\u0435\u0435)!</div>' : '';

    let correctText = '';
    if (currentMode === 'molar') {
        correctText = '\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442: ' + task.mr;
    } else {
        correctText = '\u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u044b\u0439 \u043e\u0442\u0432\u0435\u0442: ' + task.answer;
    }

    // Extra hint for equivalents step 2
    let equivHint = '';
    if (currentMode === 'equivalents' && ms().step === 2) {
        const typeNames = {acid: '\u041a\u0438\u0441\u043b\u043e\u0442\u0430', base: '\u041e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0435', salt: '\u0421\u043e\u043b\u044c', oxide: '\u041e\u043a\u0441\u0438\u0434'};
        const formulaHints = {
            acid: '\u042d = M / \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0441\u0442\u044c (\u0447\u0438\u0441\u043b\u043e H)',
            base: '\u042d = M / \u0447\u0438\u0441\u043b\u043e OH',
            salt: '\u042d = M / (\u0432\u0430\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c \u00d7 \u043a\u043e\u043b-\u0432\u043e \u0430\u0442\u043e\u043c\u043e\u0432 \u043c\u0435\u0442\u0430\u043b\u043b\u0430)',
            oxide: '\u042d = M / (\u0432\u0430\u043b\u0435\u043d\u0442\u043d\u043e\u0441\u0442\u044c \u00d7 \u043a\u043e\u043b-\u0432\u043e \u0430\u0442\u043e\u043c\u043e\u0432 \u043c\u0435\u0442\u0430\u043b\u043b\u0430)'
        };
        const ft = task.formulaType;
        equivHint = '<div style="margin-top:6px;padding:8px 12px;border-radius:8px;background:rgba(255,152,0,0.1);border:1px solid rgba(255,152,0,0.25);font-size:0.82em;">' +
            '<b style="color:#ff9800;">' + typeNames[ft] + ':</b> <span style="color:#ccc;">' + formulaHints[ft] + '</span><br>' +
            '<span style="color:#4ade80;">\u042d = ' + ms().storedM + ' / ' + task.given[0].value + ' = <b>' + task.answer + '</b></span>' +
            '</div>';
    }

    fb.innerHTML = '<div class="fb-title">&#10007; \u041d\u0435\u0432\u0435\u0440\u043d\u043e (' + valStr + '). ' + correctText + '</div>' +
        zWarn +
        equivHint +
        (task.explanation ? '<div class="fb-breakdown">' + task.explanation + '</div>' : (task.breakdown ? '<div class="fb-breakdown">' + task.breakdown + '</div>' : '')) +
        (currentMode !== 'solutions' && !(currentMode === 'equivalents' && ms().step === 2) ? '<div style="margin-top:6px;font-size:0.8em;color:#ff9800;">\u0410\u0442\u043e\u043c\u043d\u0430\u044f \u043c\u0430\u0441\u0441\u0430 \u2014 <b style="color:#4fc3f7">\u043d\u0438\u0436\u043d\u0435\u0435 \u0447\u0438\u0441\u043b\u043e</b> \u0432 \u044f\u0447\u0435\u0439\u043a\u0435</div>' : '') +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">' +
            '<button class="fb-next" onclick="retryTask()">\u041f\u043e\u043f\u0440\u043e\u0431\u043e\u0432\u0430\u0442\u044c \u0441\u043d\u043e\u0432\u0430</button>' +
            '<button class="fb-next" onclick="nextTask()" style="opacity:0.7;">' + (st.idx < tasks.length - 1 ? '\u041f\u0440\u043e\u043f\u0443\u0441\u0442\u0438\u0442\u044c &rarr;' : '\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u044b &rarr;') + '</button>' +
        '</div>';

    // Hint elements in table
    if (task.elems) {
        task.elems.forEach(sym => { if (cellMap[sym]) cellMap[sym].classList.add('hint'); });
    }
    // Highlight correct formula card for equivalents
    if (currentMode === 'equivalents' && ms().step === 2 && task.formulaType) {
        document.querySelectorAll('.fc-btn').forEach(b => {
            if (b.dataset.ft === task.formulaType) b.classList.add('correct');
        });
    }
}

function showWrongStep1(val) {
    locked = true;
    const task = curTask();
    const fb = document.getElementById('feedback');
    fb.className = 'feedback wrong';
    const valStr = isNaN(val) ? '\u043e\u0448\u0438\u0431\u043a\u0430 \u0432 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0438' : val;
    const usedZ = tokens.some(t => t.sym && t.sym.includes('(Z!)'));
    const zWarn = usedZ ? '<div style="margin-top:6px;font-size:0.82em;color:#ef5350;font-weight:700;">&#9888; \u0422\u044b \u0432\u0437\u044f\u043b(\u0430) \u0437\u0430\u0440\u044f\u0434 \u044f\u0434\u0440\u0430 (\u0432\u0435\u0440\u0445\u043d\u0435\u0435 \u0447\u0438\u0441\u043b\u043e) \u0432\u043c\u0435\u0441\u0442\u043e \u0430\u0442\u043e\u043c\u043d\u043e\u0439 \u043c\u0430\u0441\u0441\u044b (\u043d\u0438\u0436\u043d\u0435\u0435)!</div>' : '';
    fb.innerHTML = '<div class="fb-title">&#10007; \u041d\u0435\u0432\u0435\u0440\u043d\u043e (' + valStr + '). M = ' + task.mr + '</div>' +
        zWarn +
        '<div class="fb-breakdown">' + task.breakdown + '</div>' +
        '<div style="margin-top:6px;font-size:0.8em;color:#ff9800;">\u0410\u0442\u043e\u043c\u043d\u0430\u044f \u043c\u0430\u0441\u0441\u0430 \u2014 <b style="color:#4fc3f7">\u043d\u0438\u0436\u043d\u0435\u0435 \u0447\u0438\u0441\u043b\u043e</b> \u0432 \u044f\u0447\u0435\u0439\u043a\u0435</div>' +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">' +
            '<button class="fb-next" onclick="retryStep1()">\u041f\u043e\u043f\u0440\u043e\u0431\u043e\u0432\u0430\u0442\u044c \u0441\u043d\u043e\u0432\u0430</button>' +
        '</div>';
    if (task.elems) {
        task.elems.forEach(sym => { if (cellMap[sym]) cellMap[sym].classList.add('hint'); });
    }
}

function retryStep1() {
    document.querySelectorAll('.pcell.hint').forEach(c => c.classList.remove('hint'));
    document.getElementById('feedback').className = 'feedback';
    locked = false;
    tokens = [];
    renderExpr();
}

function goStep2() {
    const st = ms();
    st.step = 2;
    tokens = [];
    locked = false;
    document.getElementById('feedback').className = 'feedback';
    // For equivalents, show formula reference cards
    if (currentMode === 'equivalents') {
        showFormulaChoice();
    }
    renderStepIndicator();
    renderFormula();
    renderGivenCards();
    renderProblemText();
    updateParenButtons();
    updateTableVisibility();
    renderExpr();
    // Update task label
    const label = document.getElementById('taskLabel');
    if (currentMode === 'concentration') label.textContent = '\u0428\u0430\u0433 2: \u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435 C';
    else if (currentMode === 'equivalents') label.textContent = '\u0428\u0430\u0433 2: \u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435 \u042d';
}

/* Formula choice for equivalents */
function showFormulaChoice() {
    document.getElementById('fcLabel').textContent = '\u0424\u043e\u0440\u043c\u0443\u043b\u044b \u044d\u043a\u0432\u0438\u0432\u0430\u043b\u0435\u043d\u0442\u043e\u0432 (\u0441\u043f\u0440\u0430\u0432\u043e\u0447\u043d\u0438\u043a):';
    document.getElementById('fcLabel').classList.add('visible');
    document.getElementById('formulaChoice').classList.add('visible');
    document.querySelectorAll('.fc-btn').forEach(b => {
        b.classList.remove('correct', 'wrong');
        b.style.cursor = 'default';
        b.style.opacity = '0.85';
    });
}

function hideFormulaChoice() {
    document.getElementById('fcLabel').classList.remove('visible');
    document.getElementById('formulaChoice').classList.remove('visible');
    document.querySelectorAll('.fc-btn').forEach(b => {
        b.style.cursor = '';
        b.style.opacity = '';
    });
}

/* Formula choice cards are now reference-only (no click gating) */

function retryTask() {
    document.querySelectorAll('.pcell.hint').forEach(c => c.classList.remove('hint'));
    document.getElementById('feedback').className = 'feedback';
    locked = false;
    tokens = [];
    const st = ms();
    st.results[st.idx] = undefined;
    // For two-step modes on step 2, stay on step 2 (M already computed)
    if (st.step === 2) {
        document.querySelectorAll('.fc-btn').forEach(b => b.classList.remove('correct', 'wrong'));
        renderExpr();
        return;
    }
    // For two-step modes on step 1, reset
    if (st.step !== undefined) {
        st.step = 1;
        st.storedM = null;
    }
    loadTask();
}

function nextTask() {
    document.querySelectorAll('.pcell.hint').forEach(c => c.classList.remove('hint'));
    document.getElementById('feedback').className = 'feedback';
    locked = false;
    tokens = [];
    const st = ms();
    st.idx++;
    if (st.step !== undefined) { st.step = 1; st.storedM = null; }
    if (st.idx >= curTasks().length) { showFinal(); return; }
    loadTask();
}

function showFinal() {
    const st = ms();
    const tasks = curTasks();
    const pct = Math.round(st.score / tasks.length * 100);
    const fb = document.getElementById('feedback');
    fb.className = 'feedback ' + (pct >= 70 ? 'correct' : 'wrong');
    let msg = '';
    if (pct >= 90) msg = '\u041e\u0442\u043b\u0438\u0447\u043d\u043e!';
    else if (pct >= 70) msg = '\u0425\u043e\u0440\u043e\u0448\u043e! \u0415\u0449\u0451 \u043f\u0440\u0430\u043a\u0442\u0438\u043a\u0438.';
    else msg = '\u0421\u0442\u043e\u0438\u0442 \u043f\u043e\u0432\u0442\u043e\u0440\u0438\u0442\u044c.';
    fb.innerHTML = '<div class="fb-title">\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442: ' + st.score + '/' + tasks.length + ' (' + pct + '%)</div>' +
        '<div style="color:#bbb;">' + msg + '</div>' +
        '<button class="fb-next" onclick="restart()">\u041f\u0440\u043e\u0439\u0442\u0438 \u0437\u0430\u043d\u043e\u0432\u043e</button>';
    document.getElementById('exprWrap').innerHTML = '';
    document.getElementById('problemText').classList.remove('visible');
    document.getElementById('stepIndicator').style.display = 'none';
    document.getElementById('givenArea').classList.remove('visible');
    hideFormulaChoice();
}

function restart() {
    const st = ms();
    st.idx = 0; st.score = 0; st.results = [];
    if (st.step !== undefined) { st.step = 1; st.storedM = null; }
    tokens = []; locked = false;
    document.getElementById('feedback').className = 'feedback';
    loadTask();
}

/* ══════════════════════════════════════════════════════════
   ── HELPERS ──
   ══════════════════════════════════════════════════════════ */
function renderProblemText() {
    const el = document.getElementById('problemText');
    const task = curTask();
    if (!task || !task.problem || (currentMode === 'molar')) {
        el.classList.remove('visible');
        return;
    }
    el.classList.add('visible');
    el.innerHTML = task.problem;
}

function loadTask() {
    // If all tasks done — show final
    if (ms().idx >= curTasks().length) { showFinal(); return; }
    updateSubtitle();
    updateTableVisibility();
    updateParenButtons();
    renderStepIndicator();
    renderFormula();
    renderGivenCards();
    renderProblemText();
    renderExpr();
    renderDots();
    updateScore();
    hideFormulaChoice();

    // Update task label
    const label = document.getElementById('taskLabel');
    if (currentMode === 'molar') {
        label.textContent = '\u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435';
    } else if (currentMode === 'concentration') {
        label.textContent = '\u0428\u0430\u0433 1: \u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435 M';
    } else if (currentMode === 'solutions') {
        label.textContent = '\u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435';
    } else if (currentMode === 'equivalents') {
        label.textContent = '\u0428\u0430\u0433 1: \u0412\u044b\u0447\u0438\u0441\u043b\u0438\u0442\u0435 M';
    }

    // For solutions, show the find formula
    if (currentMode === 'solutions') {
        const task = curTask();
        if (task) {
            document.getElementById('taskFormulaWrap').innerHTML = '<span style="font-size:0.55em;font-weight:400;">' + task.find + '</span> = <b>?</b>';
        }
    }
}

function flashCell(sym) {
    const cell = cellMap[sym];
    if (!cell) return;
    cell.classList.add('flash');
    setTimeout(() => cell.classList.remove('flash'), 350);
}

/* ── Init ── */
loadTask();
</script>
</body>
</html>
