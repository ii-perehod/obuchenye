<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химия — Квиз: Темы 1-2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }

        h1 {
            text-align: center; font-size: 1.7em; margin-bottom: 6px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.9em; }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Setup */
        .topic-btn {
            display: block; width: 100%;
            padding: 16px 20px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; background: rgba(255,255,255,0.04);
            color: #e0e0e0; font-size: 1em; cursor: pointer;
            text-align: left; margin-bottom: 10px; transition: all 0.25s;
        }
        .topic-btn:hover {
            background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.35);
            transform: translateX(4px);
        }
        .topic-btn .t-label {
            font-weight: 700; font-size: 0.72em; display: block; margin-bottom: 3px; letter-spacing: 0.04em;
        }
        .topic-btn .t-desc { color: #aaa; font-size: 0.88em; }

        /* Progress */
        .prog-wrap { margin-bottom: 20px; }
        .prog-info { display: flex; justify-content: space-between; color: #888; font-size: 0.82em; margin-bottom: 6px; }
        .prog-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; overflow: hidden; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, #00d2ff, #7b2ff7); border-radius: 10px; transition: width 0.4s; }

        /* Tags */
        .topic-tag {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 0.72em; font-weight: 700; margin-bottom: 14px;
        }
        .tag-б1 { background: rgba(0,210,255,0.2); color: #00d2ff; }
        .tag-б2 { background: rgba(123,47,247,0.2); color: #b57bff; }
        .tag-б3 { background: rgba(74,222,128,0.2); color: #4ade80; }
        .tag-б4 { background: rgba(251,146,60,0.2); color: #fb923c; }

        .round-badge {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 0.72em; font-weight: 700; margin-bottom: 14px; margin-left: 8px;
            background: rgba(245,158,11,0.2); color: #f59e0b;
        }

        /* Question */
        .question-text { font-size: 1.1em; line-height: 1.6; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 13px 16px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 11px; cursor: pointer; transition: all 0.22s;
            font-size: 0.95em; line-height: 1.45; background: rgba(255,255,255,0.03);
        }
        .option:hover:not(.disabled) { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.3); }
        .option.correct { border-color: #4ade80; background: rgba(74,222,128,0.13); color: #4ade80; }
        .option.wrong   { border-color: #ff5252; background: rgba(255,82,82,0.13);  color: #ff5252; }
        .option.disabled { pointer-events: none; }

        .explanation {
            margin-top: 14px; padding: 14px 16px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border-left: 3px solid #7b2ff7;
            font-size: 0.88em; line-height: 1.6; display: none;
        }

        /* Buttons */
        .btn {
            display: inline-block; padding: 12px 28px; border: none;
            border-radius: 10px; font-size: 1em; cursor: pointer;
            font-weight: 600; transition: all 0.25s; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #7b2ff7); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,210,255,0.3); }
        .btn-outline {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: #ccc; padding: 10px 22px;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.08); }
        .btn-repeat {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
            50%       { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
        }
        .btn-row { text-align: center; margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        /* Theory */
        .theory-title { font-size: 1.15em; font-weight: 700; margin-bottom: 16px; color: #7b2ff7; }
        .theory-content { font-size: 0.92em; line-height: 1.65; }
        .theory-content p { margin-bottom: 12px; }

        /* Results */
        .results-head { text-align: center; margin-bottom: 20px; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 20px auto; font-size: 2.2em; font-weight: 700;
        }
        .score-great { background: rgba(0,230,118,0.15); border: 3px solid #00e676; color: #00e676; }
        .score-ok    { background: rgba(255,193,7,0.15); border: 3px solid #ffc107; color: #ffc107; }
        .score-bad   { background: rgba(255,82,82,0.15); border: 3px solid #ff5252; color: #ff5252; }

        .topic-stats { margin: 16px 0; }
        .topic-stat { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .ts-label { flex: 0 0 160px; font-size: 0.85em; color: #aaa; }
        .ts-bar { flex: 1; background: rgba(255,255,255,0.1); border-radius: 6px; height: 8px; overflow: hidden; }
        .ts-fill { height: 100%; border-radius: 6px; transition: width 0.4s; }
        .ts-num { flex: 0 0 50px; text-align: right; font-size: 0.82em; color: #ccc; }

        /* Emoji burst */
        .emoji-burst {
            position: fixed; font-size: 2.5em; z-index: 1000;
            animation: burst 0.9s ease-out forwards; pointer-events: none;
        }
        @keyframes burst {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }

        @media (max-width: 500px) {
            .ts-label { flex: 0 0 110px; font-size: 0.78em; }
        }

        sub { font-size: 0.75em; }
    </style>
</head>

<div class="container">

</div>

<script>
// ─────────────────────────────────────────────────────────────────
// THEORY DATA
// ─────────────────────────────────────────────────────────────────
const THEORY = {
  'б1': {
    title: 'Базовые понятия',
    html: `
      <p><b>1. Атом</b> — это мельчайшая частица вещества (элемента, если точнее). Атомы невидимые, меньше не бывает (в химии). У каждого атома своя «начинка» — ядро с протонами и нейтронами, и электронное облако.</p>
      <p><b>2. Молекула</b> — это группа из двух или более атомов, прочно связанных друг с другом. Можно представить как конструктор LEGO — атомы соединяются в разные фигуры.</p>
      <p><b>3. Простое вещество</b> — состоит из атомов ОДНОГО элемента.<br>
      Пример: Кислород (O₂) — два атома кислорода. Железо (Fe) — куча одинаковых атомов.</p>
      <p><b>4. Сложное вещество</b> — состоит из атомов РАЗНЫХ элементов.<br>
      Пример: Вода (H₂O) — два атома водорода и один кислород.</p>
      <p><b>5. Аллотропия</b> — это когда из одного и того же элемента можно получить разные вещества.<br>
      Пример: Из атомов углерода можно собрать алмаз (самый твёрдый), а можно — графит (мягкий, в карандашах). Разные формы, а элемент один.</p>
    `
  },
  'б2': {
    title: 'Количественные отношения',
    html: `
      <p><b>6. Моль</b> — это просто порция вещества. Как дюжина (12 штук) или сотня (100 штук). Химики придумали считать атомы не по одному (слишком мелкие), поэтому они работают с порциями — молями.</p>
      <p><b>7. Число Авогадро (6,02 · 10²³)</b> — это количество штук в одном моле. Число гигантское, потому что атомы крошечные. В 1 моле любого вещества ровно столько частиц.</p>
      <p><b>8. Молярная масса (M)</b> — это вес одного моля (целой порции).<br>
      Подсказка: число в таблице Менделеева — это и есть молярная масса в г/моль.<br>
      Углерод (C): в таблице 12 → 1 моль весит 12 г.<br>
      Золото (Au): в таблице 197 → 1 моль весит 197 г.<br>
      Фишка: в обоих случаях (и в 12 г угля, и в 197 г золота) одинаковое КОЛИЧЕСТВО атомов — число Авогадро.</p>
      <p><b>9. Молярный объём газа (22,4 л)</b> — универсальная константа: любой газ (хоть водород, хоть хлор) при нормальных условиях занимает одинаковый объём.<br>
      1 моль любого газа = 22,4 литра.</p>
    `
  },
  'б3': {
    title: 'Эквиваленты',
    html: `
      <p><b>Эквивалент</b> — это «обменная монета» в химии. Показывает, какая порция вещества может заместить или присоединить столько же, сколько 1 моль водорода.</p>
      <p><b>10. Эквивалент кислоты</b> — делим молярную массу на количество H⁺, которое кислота может отдать.<br>
      Как считать: M делим на количество H.<br>
      HCl — один водород → эквивалент равен молярной массе целиком.<br>
      H₂SO₄ — два водорода → эквивалент = M / 2.</p>
      <p><b>11. Эквивалент основания</b> — делим на количество групп OH⁻.<br>
      NaOH — одна группа OH → эквивалент равен молярной массе целиком.</p>
      <p><b>12. Эквивалент соли</b> — делим на (заряд металла × число атомов металла).</p>
    `
  },
  'б4': {
    title: 'Строение атома',
    html: `
      <p><b>Ядро:</b> протоны (заряд +) и нейтроны (без заряда). Число протонов = порядковый номер элемента.</p>
      <p><b>Изотопы</b> — атомы одного элемента с разным числом нейтронов. Протонов столько же, а нейтронов больше или меньше. Как братья-близнецы разного веса.</p>
      <p><b>Атомная орбиталь</b> — область пространства, где вероятнее всего находится электрон. Не орбита (не летает по кругу!), а облако.</p>
      <p><b>Формы орбиталей:</b><br>
      • s — сфера (шарик)<br>
      • p — гантель (два шарика)<br>
      • d — сложная форма (четырёхлепестковый клевер)</p>
      <p><b>4 квантовых числа</b> описывают каждый электрон:<br>
      • n (главное) — номер этажа (1, 2, 3...)<br>
      • l (орбитальное) — форма комнаты (0=s, 1=p, 2=d, 3=f)<br>
      • m<sub>l</sub> (магнитное) — ориентация комнаты в пространстве<br>
      • m<sub>s</sub> (спиновое) — направление вращения (+½ или −½)</p>
      <p><b>Принцип Паули:</b> в одной комнате (орбитали) максимум 2 электрона, и они должны вращаться в разные стороны.</p>
      <p><b>Правило Клечковского:</b> электроны заполняют орбитали в порядке возрастания суммы (n + l). При одинаковой сумме — сначала меньшее n.<br>
      Порядок: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d...<br>
      Поэтому 4s заполняется РАНЬШЕ 3d!</p>
      <p><b>Правило Хунда:</b> электроны сначала расселяются по одному в каждую орбиталь подуровня (как люди в автобусе — сначала по одному на каждое сиденье), и только потом подсаживаются вторые.</p>
    `
  }
};

// ─────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────
const TAG_NAMES   = { 'б1': 'Базовые понятия', 'б2': 'Количественные отношения', 'б3': 'Эквиваленты', 'б4': 'Строение атома' };
const TAG_CLASSES = { 'б1': 'tag-б1', 'б2': 'tag-б2', 'б3': 'tag-б3', 'б4': 'tag-б4' };
const TOPIC_COLORS = { 'б1': '#00d2ff', 'б2': '#b57bff', 'б3': '#4ade80', 'б4': '#fb923c' };

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
let queue = [];
let wrongQ = [];
let round = 1;
let idx = 0;
let queueSize = 0;
let roundCorrect = 0;
let shownTheory = new Set();
let selectedTopics = [];
let statsPerTopic = {};
let pendingQ = null;
let _currentQ = null;
let _isRetry = false;
let isAllMode = false;
let _opts = [];
let _correctOrig = 0;

// ─────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function emojiBurst(emoji) {
  const el = document.createElement('div');
  el.className = 'emoji-burst';
  el.textContent = emoji;
  el.style.left = (20 + Math.random() * 60) + '%';
  el.style.top = '35%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// ─────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────
function goSetup() { showScreen('screenSetup'); }

function startQuiz(topicKey) {
  isAllMode = (topicKey === 'all');
  if (topicKey === 'all') {
    selectedTopics = ['б1', 'б2', 'б3', 'б4'];
    queue = shuffle(ALL_Q);
  } else {
    selectedTopics = [topicKey];
    queue = shuffle(ALL_Q.filter(q => q.t === topicKey));
  }
  wrongQ = [];
  round = 1;
  idx = 0;
  queueSize = queue.length;
  roundCorrect = 0;
  shownTheory = new Set();
  statsPerTopic = {};
  selectedTopics.forEach(t => { statsPerTopic[t] = { c: 0, total: 0 }; });
  queue.forEach(q => { if (statsPerTopic[q.t]) statsPerTopic[q.t].total++; });
  showNextQuestion();
}

function startRepeat() {
  // Show theory again for topics that had wrong answers
  const wrongTopics = new Set(wrongQ.map(q => q.t));
  wrongTopics.forEach(t => shownTheory.delete(t));

  queue = shuffle(wrongQ);
  wrongQ = [];
  idx = 0;
  queueSize = queue.length;
  roundCorrect = 0;
  round++;
  showNextQuestion();
}

function restartSame() {
  if (selectedTopics.length > 1) startQuiz('all');
  else startQuiz(selectedTopics[0]);
}

// ─────────────────────────────────────────────────────────────────
// THEORY FLASH
// ─────────────────────────────────────────────────────────────────
function showNextQuestion() {
  if (idx >= queue.length) {
    showResults();
    return;
  }
  const q = queue[idx];

  if (isAllMode) {
    // "Все темы": round 1 — без теории; повтор ошибок — теория перед каждым вопросом
    if (round > 1 && THEORY[q.t]) {
      pendingQ = q;
      document.getElementById('theoryTitle').textContent = THEORY[q.t].title;
      document.getElementById('theoryContent').innerHTML = THEORY[q.t].html;
      showScreen('screenTheory');
      return;
    }
  } else {
    // Отдельная тема: теория один раз в начале
    if (!shownTheory.has(q.t) && THEORY[q.t]) {
      shownTheory.add(q.t);
      pendingQ = q;
      document.getElementById('theoryTitle').textContent = THEORY[q.t].title;
      document.getElementById('theoryContent').innerHTML = THEORY[q.t].html;
      showScreen('screenTheory');
      return;
    }
  }
  renderQuestion(q, round > 1);
}

function skipTheory() {
  showScreen('screenQuiz');
  renderQuestion(pendingQ, false);
}

// ─────────────────────────────────────────────────────────────────
// QUIZ
// ─────────────────────────────────────────────────────────────────
function renderQuestion(q, isRetry) {
  _currentQ = q;
  _isRetry = !!isRetry;
  showScreen('screenQuiz');

  // Progress bar
  const pct = Math.round(idx / queueSize * 100);
  document.getElementById('progLabel').textContent = `Вопрос ${idx + 1} из ${queueSize}`;
  document.getElementById('progScore').textContent = `\u2713 ${roundCorrect} \u00b7 \u2717 ${idx - roundCorrect}`;
  document.getElementById('progFill').style.width = pct + '%';

  // Tags
  const tag = document.getElementById('quizTag');
  tag.textContent = TAG_NAMES[q.t];
  tag.className = 'topic-tag ' + TAG_CLASSES[q.t];

  const rb = document.getElementById('roundBadge');
  if (round > 1) { rb.style.display = 'inline-block'; rb.textContent = 'Раунд ' + round; }
  else            { rb.style.display = 'none'; }

  // Question text
  document.getElementById('questionText').innerHTML = q.q;

  // Shuffle options, keep original index mapping
  _opts = shuffle(q.o.map((text, i) => ({ text, orig: i })));
  _correctOrig = q.c;

  document.getElementById('optionsDiv').innerHTML = _opts.map((opt, i) =>
    `<div class="option" id="opt_${i}" onclick="pickAnswer(${i}, ${opt.orig})">${opt.text}</div>`
  ).join('');

  // Reset explanation and next button
  const expl = document.getElementById('explanation');
  expl.style.display = 'none';
  expl.innerHTML = q.e;
  document.getElementById('nextBtnWrap').style.display = 'none';

  // Update next button label
  const isLast = (idx === queueSize - 1);
  document.getElementById('nextBtn').textContent = isLast ? 'Результаты \u2192' : 'Следующий \u2192';
}

function pickAnswer(displayIdx, origIdx) {
  const q = queue[idx];

  // Disable all options
  document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));

  const isCorrect = (origIdx === _correctOrig);
  const correctDisplayIdx = _opts.findIndex(o => o.orig === _correctOrig);

  if (isCorrect) {
    document.getElementById('opt_' + displayIdx).classList.add('correct');
    if (!_isRetry) {
      roundCorrect++;
      if (round === 1 && statsPerTopic[q.t]) statsPerTopic[q.t].c++;
    }
    emojiBurst('\u2705');
  } else {
    document.getElementById('opt_' + displayIdx).classList.add('wrong');
    document.getElementById('opt_' + correctDisplayIdx).classList.add('correct');
    if (!_isRetry) wrongQ.push(q);
  }

  // Update score display immediately
  document.getElementById('progScore').textContent = `\u2713 ${roundCorrect} \u00b7 \u2717 ${(idx + 1) - roundCorrect}`;
  document.getElementById('progFill').style.width = Math.round((idx + 1) / queueSize * 100) + '%';

  document.getElementById('explanation').style.display = 'block';
  document.getElementById('nextBtnWrap').style.display = 'flex';

  idx++;
}

function nextQuestion() {
  showNextQuestion();
}

// ─────────────────────────────────────────────────────────────────
// RESULTS
// ─────────────────────────────────────────────────────────────────
function showResults() {
  const pct = queueSize > 0 ? Math.round(roundCorrect / queueSize * 100) : 0;
  let grade, cls;
  if (pct >= 80)      { grade = 'Отлично!';       cls = 'score-great'; }
  else if (pct >= 60) { grade = 'Хорошо!';        cls = 'score-ok'; }
  else                { grade = 'Нужно повторить'; cls = 'score-bad'; }

  document.getElementById('resultsGrade').textContent = grade;
  const sc = document.getElementById('scoreCircle');
  sc.textContent = pct + '%';
  sc.className = 'score-circle ' + cls;

  const roundLabel = round > 1 ? ` (Раунд ${round})` : '';
  document.getElementById('resultsSub').textContent =
    `${roundCorrect} из ${queueSize} верно${roundLabel}`;

  // Per-topic stats (from round 1)
  const statsDiv = document.getElementById('topicStats');
  statsDiv.innerHTML = Object.entries(statsPerTopic).map(([t, s]) => {
    const p = s.total > 0 ? Math.round(s.c / s.total * 100) : 0;
    return `
      <div class="topic-stat">
        <div class="ts-label">${TAG_NAMES[t]}</div>
        <div class="ts-bar"><div class="ts-fill" style="width:${p}%; background:${TOPIC_COLORS[t]}"></div></div>
        <div class="ts-num">${s.c}/${s.total}</div>
      </div>`;
  }).join('');

  // Repeat button
  const btnR = document.getElementById('btnRepeat');
  if (wrongQ.length > 0) {
    btnR.style.display = 'inline-block';
    document.getElementById('wrongCount').textContent = wrongQ.length;
  } else {
    btnR.style.display = 'none';
  }

  showScreen('screenResults');
}

// ─────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────
showScreen('screenSetup');
</script>
