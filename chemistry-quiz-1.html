<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Химия — Квиз: Тема 1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }

        h1 {
            text-align: center; font-size: 1.7em; margin-bottom: 6px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 0.9em; }
        .back-link { display: inline-block; margin-bottom: 8px; color: #00d2ff; text-decoration: none; font-size: 0.82em; opacity: 0.7; transition: opacity 0.2s; margin-right: 16px; }
        .back-link:hover { opacity: 1; }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Setup */
        .topic-btn {
            display: block; width: 100%;
            padding: 16px 20px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px; background: rgba(255,255,255,0.04);
            color: #e0e0e0; font-size: 1em; cursor: pointer;
            text-align: left; margin-bottom: 10px; transition: all 0.25s;
        }
        .topic-btn:hover {
            background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.35);
            transform: translateX(4px);
        }
        .topic-btn .t-label {
            font-weight: 700; font-size: 0.72em; display: block; margin-bottom: 3px; letter-spacing: 0.04em;
        }
        .topic-btn .t-desc { color: #aaa; font-size: 0.88em; }

        /* Progress */
        .prog-wrap { margin-bottom: 20px; }
        .prog-info { display: flex; justify-content: space-between; color: #888; font-size: 0.82em; margin-bottom: 6px; }
        .prog-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; overflow: hidden; }
        .prog-fill { height: 100%; background: linear-gradient(90deg, #00d2ff, #7b2ff7); border-radius: 10px; transition: width 0.4s; }

        /* Tags */
        .topic-tag {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 0.72em; font-weight: 700; margin-bottom: 14px;
        }
        .tag-т1 { background: rgba(0,210,255,0.2); color: #00d2ff; }
        .tag-т2 { background: rgba(74,222,128,0.2); color: #4ade80; }

        .round-badge {
            display: inline-block; padding: 3px 12px; border-radius: 20px;
            font-size: 0.72em; font-weight: 700; margin-bottom: 14px; margin-left: 8px;
            background: rgba(245,158,11,0.2); color: #f59e0b;
        }

        /* Question */
        .question-text { font-size: 1.1em; line-height: 1.6; margin-bottom: 20px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            padding: 13px 16px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 11px; cursor: pointer; transition: all 0.22s;
            font-size: 0.95em; line-height: 1.45; background: rgba(255,255,255,0.03);
        }
        .option:hover:not(.disabled) { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.3); }
        .option.correct { border-color: #4ade80; background: rgba(74,222,128,0.13); color: #4ade80; }
        .option.wrong   { border-color: #ff5252; background: rgba(255,82,82,0.13);  color: #ff5252; }
        .option.disabled { pointer-events: none; }

        .explanation {
            margin-top: 14px; padding: 14px 16px; border-radius: 10px;
            background: rgba(255,255,255,0.05); border-left: 3px solid #7b2ff7;
            font-size: 0.88em; line-height: 1.6; display: none;
        }

        /* Buttons */
        .btn {
            display: inline-block; padding: 12px 28px; border: none;
            border-radius: 10px; font-size: 1em; cursor: pointer;
            font-weight: 600; transition: all 0.25s; color: #fff;
        }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #7b2ff7); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,210,255,0.3); }
        .btn-outline {
            background: transparent; border: 1px solid rgba(255,255,255,0.3);
            color: #ccc; padding: 10px 22px;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.08); }
        .btn-repeat {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
            50%       { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
        }
        .btn-row { text-align: center; margin-top: 18px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        /* ═══════════════════════════════════════════
           THEORY — BEAUTIFUL STYLING
           ═══════════════════════════════════════════ */
        .theory-title { font-size: 1.25em; font-weight: 700; margin-bottom: 18px; color: #7b2ff7; text-align: center; }
        .theory-content { font-size: 0.93em; line-height: 1.7; }
        .theory-content p { margin-bottom: 14px; }

        /* Section headers inside theory */
        .th-section {
            font-size: 1.05em; font-weight: 700; margin: 28px 0 14px;
            padding-bottom: 8px; border-bottom: 2px solid rgba(123,47,247,0.3);
        }
        .th-section:first-child { margin-top: 0; }
        .th-section .th-num {
            display: inline-flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            color: #fff; font-size: 0.75em; font-weight: 800;
            margin-right: 10px; vertical-align: middle;
        }

        /* Key term highlighting */
        .key { color: #00d2ff; font-weight: 700; }
        .key-green { color: #4ade80; font-weight: 700; }
        .key-orange { color: #fb923c; font-weight: 700; }
        .key-pink { color: #f472b6; font-weight: 700; }
        .key-yellow { color: #fbbf24; font-weight: 700; }

        /* Beautiful fraction */
        .frac {
            display: inline-flex; flex-direction: column; align-items: center;
            vertical-align: middle; margin: 0 4px; line-height: 1.2;
        }
        .frac-top {
            padding: 2px 10px 4px;
            border-bottom: 2px solid #00d2ff;
        }
        .frac-bot {
            padding: 4px 10px 2px;
        }

        /* Big formula box */
        .formula-box {
            background: rgba(123,47,247,0.12);
            border: 1px solid rgba(123,47,247,0.35);
            border-radius: 14px;
            padding: 18px 22px;
            margin: 16px 0;
            text-align: center;
            font-size: 1.15em;
            line-height: 2;
        }

        /* Law card */
        .law-card {
            background: rgba(0,210,255,0.06);
            border-left: 4px solid #00d2ff;
            border-radius: 0 12px 12px 0;
            padding: 16px 20px;
            margin: 14px 0;
        }
        .law-card.law-green { border-left-color: #4ade80; background: rgba(74,222,128,0.06); }
        .law-card.law-orange { border-left-color: #fb923c; background: rgba(251,146,60,0.06); }
        .law-card.law-pink { border-left-color: #f472b6; background: rgba(244,114,182,0.06); }
        .law-card.law-yellow { border-left-color: #fbbf24; background: rgba(251,191,36,0.06); }

        .law-card .law-name {
            font-weight: 700; font-size: 1em; margin-bottom: 6px;
        }
        .law-card .law-year {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 0.72em; font-weight: 700; margin-left: 8px;
            background: rgba(255,255,255,0.1); color: #aaa;
        }
        .law-card .law-text {
            font-size: 0.9em; color: #ccc; line-height: 1.65;
        }

        /* Trainer link */
        .trainer-link {
            display: inline-block; margin-top: 8px;
            padding: 5px 14px; border-radius: 20px;
            background: rgba(123,47,247,0.2); border: 1px solid rgba(123,47,247,0.4);
            color: #b57bff; font-size: 0.78em; font-weight: 600;
            text-decoration: none; transition: all 0.2s;
        }
        .trainer-link:hover { background: rgba(123,47,247,0.35); }

        /* Equivalents table */
        .eq-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            margin: 14px 0; border-radius: 12px; overflow: hidden;
        }
        .eq-table th {
            background: rgba(74,222,128,0.15);
            color: #4ade80; padding: 10px 14px;
            text-align: left; font-size: 0.85em; font-weight: 700;
        }
        .eq-table td {
            padding: 12px 14px; border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 0.88em; line-height: 1.7; vertical-align: middle;
        }
        .eq-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

        /* Theory page navigation */
        .theory-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 20px; padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .page-dots {
            display: flex; gap: 8px; justify-content: center; flex: 1;
        }
        .page-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.15); transition: all 0.3s;
        }
        .page-dot.active { background: #7b2ff7; transform: scale(1.2); }

        /* Image styling */
        .theory-img {
            max-width: 100%; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            margin: 10px 0;
        }

        /* Note box */
        .note-box {
            background: rgba(251,191,36,0.08);
            border: 1px solid rgba(251,191,36,0.25);
            border-radius: 12px;
            padding: 14px 18px;
            margin: 14px 0;
            font-size: 0.88em; line-height: 1.65;
        }
        .note-box .note-icon { font-size: 1.1em; margin-right: 6px; }

        /* Results */
        .results-head { text-align: center; margin-bottom: 20px; }
        .score-circle {
            width: 120px; height: 120px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 20px auto; font-size: 2.2em; font-weight: 700;
        }
        .score-great { background: rgba(0,230,118,0.15); border: 3px solid #00e676; color: #00e676; }
        .score-ok    { background: rgba(255,193,7,0.15); border: 3px solid #ffc107; color: #ffc107; }
        .score-bad   { background: rgba(255,82,82,0.15); border: 3px solid #ff5252; color: #ff5252; }

        .topic-stats { margin: 16px 0; }
        .topic-stat { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .ts-label { flex: 0 0 160px; font-size: 0.85em; color: #aaa; }
        .ts-bar { flex: 1; background: rgba(255,255,255,0.1); border-radius: 6px; height: 8px; overflow: hidden; }
        .ts-fill { height: 100%; border-radius: 6px; transition: width 0.4s; }
        .ts-num { flex: 0 0 50px; text-align: right; font-size: 0.82em; color: #ccc; }

        /* Emoji burst */
        .emoji-burst {
            position: fixed; font-size: 2.5em; z-index: 1000;
            animation: burst 0.9s ease-out forwards; pointer-events: none;
        }
        @keyframes burst {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }

        @media (max-width: 500px) {
            .ts-label { flex: 0 0 110px; font-size: 0.78em; }
            .formula-box { font-size: 1em; padding: 14px 16px; }
            .eq-table td, .eq-table th { padding: 8px 10px; font-size: 0.82em; }
        }

        sub { font-size: 0.75em; }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">&larr; Все темы</a>
    <a href="https://ii-perehod.github.io/" class="back-link">&larr; Портфолио</a>
    <h1>Химия: Тема 1</h1>
    <div class="subtitle">Основные понятия, стехиометрические законы, эквиваленты</div>

    <!-- ── MENU ── -->
    <div class="screen active" id="screenSetup">
        <div class="card">
            <div style="font-size:1.05em; font-weight:700; margin-bottom:18px; color:#7b2ff7;">Выбери раздел:</div>
            <button class="topic-btn" onclick="startQuiz('т1')">
                <span class="t-label" style="color:#00d2ff">ОСНОВНЫЕ ПОНЯТИЯ И ЗАКОНЫ — 9 вопросов</span>
                <span class="t-desc">Атом, молекула, моль, массы, число Авогадро, 5 стехиометрических законов</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('т2')">
                <span class="t-label" style="color:#4ade80">ЭКВИВАЛЕНТЫ — 8 вопросов</span>
                <span class="t-desc">Закон эквивалентов, формулы для кислот, оснований, солей, простых веществ</span>
            </button>
            <button class="topic-btn" onclick="startQuiz('all')" style="margin-top:12px;border-color:rgba(0,210,255,0.4);">
                <span class="t-label" style="color:#00d2ff">ВСЕ ТЕМЫ — 17 вопросов</span>
                <span class="t-desc">Общий зачёт: всё вперемешку. 1-й круг без теории, ошибки — с теорией</span>
            </button>
        </div>
    </div>

    <!-- ── THEORY ── -->
    <div class="screen" id="screenTheory">
        <div style="text-align:right; margin-bottom:10px">
            <button class="btn btn-outline" onclick="goSetup()" style="padding:7px 16px;font-size:0.82em">← Выбор раздела</button>
        </div>
        <div class="card">
            <div class="theory-title" id="theoryTitle"></div>
            <div class="theory-content" id="theoryContent"></div>
            <div class="theory-nav">
                <button class="btn btn-outline" id="thPrev" onclick="theoryPrev()" style="padding:8px 18px;font-size:0.88em">← Назад</button>
                <div class="page-dots" id="pageDots"></div>
                <button class="btn btn-primary" id="thNext" onclick="theoryNext()" style="padding:8px 18px;font-size:0.88em">Далее →</button>
            </div>
        </div>
    </div>

    <!-- ── QUIZ ── -->
    <div class="screen" id="screenQuiz">
        <div style="text-align:right; margin-bottom:8px">
            <button class="btn btn-outline" onclick="goSetup()" style="padding:7px 16px;font-size:0.82em">← Выбор раздела</button>
        </div>
        <div class="prog-wrap">
            <div class="prog-info">
                <span id="progLabel">Вопрос 1 из 17</span>
                <span id="progScore">✓ 0 · ✗ 0</span>
            </div>
            <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        </div>
        <div class="card">
            <span class="topic-tag" id="quizTag"></span>
            <span class="round-badge" id="roundBadge" style="display:none"></span>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsDiv"></div>
            <div class="explanation" id="explanation"></div>
            <div class="btn-row" id="nextBtnWrap" style="display:none">
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Следующий →</button>
            </div>
        </div>
    </div>

    <!-- ── RESULTS ── -->
    <div class="screen" id="screenResults">
        <div class="card">
            <div class="results-head">
                <div style="font-size:1.35em; font-weight:700;" id="resultsGrade"></div>
                <div class="score-circle" id="scoreCircle"></div>
                <div style="color:#888; font-size:0.88em;" id="resultsSub"></div>
            </div>
            <div class="topic-stats" id="topicStats"></div>
            <div class="btn-row">
                <button class="btn btn-outline" onclick="goSetup()">← Выбор раздела</button>
                <button class="btn btn-primary" onclick="restartSame()">Пройти заново</button>
                <button class="btn btn-repeat" id="btnRepeat" style="display:none" onclick="startRepeat()">Повторить ошибки (<span id="wrongCount">0</span>)</button>
            </div>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// THEORY DATA — PAGINATED
// ═══════════════════════════════════════════════════════════════════
const THEORY = {
  'т1': {
    title: 'Основные понятия и стехиометрические законы',
    pages: [
      // ─── PAGE 1: Атом, молекула, простое/сложное ───
      `<div class="th-section"><span class="th-num">1</span>Из чего состоит вещество?</div>
       <p><span class="key">Атом</span> — мельчайшая частица <em>химического элемента</em>. Атомы — это «кирпичики», из которых построено всё вокруг.</p>
       <p><span class="key">Молекула</span> — группа из двух или более атомов, прочно связанных друг с другом. Молекула — это уже <em>вещество</em>, которое сохраняет его химические свойства.</p>
       <p style="text-align:center"><img src="atom-molecule.png" alt="Атом vs Молекула" class="theory-img"></p>
       <p><span class="key-green">Простое вещество</span> — состоит из атомов <b>одного</b> элемента.<br>
       Примеры: O<sub>2</sub> (кислород), Fe (железо), N<sub>2</sub> (азот).</p>
       <p><span class="key-pink">Сложное вещество</span> — состоит из атомов <b>разных</b> элементов.<br>
       Примеры: H<sub>2</sub>O (вода), NaCl (соль), CO<sub>2</sub> (углекислый газ).</p>
       <p style="text-align:center"><img src="element-compound.png" alt="Простое vs Сложное вещество" class="theory-img"></p>
       <p><span class="key-orange">Аллотропия</span> — когда из атомов <b>одного и того же</b> элемента можно собрать <b>разные</b> вещества. Углерод → алмаз (твёрдый) и графит (мягкий). Кислород → O<sub>2</sub> и озон O<sub>3</sub>.</p>
       <p style="text-align:center"><img src="allotropy.png" alt="Аллотропия: графит и алмаз" class="theory-img"></p>`,

      // ─── PAGE 2: Массы, моль, Авогадро ───
      `<div class="th-section"><span class="th-num">2</span>Массы: атомная, молекулярная, молярная</div>
       <p><span class="key">Атомная масса A<sub>r</sub></span> — масса одного атома в <em>атомных единицах массы</em> (а.е.м.). Берётся из таблицы Менделеева. Это <b>относительная</b> масса — относительно 1/12 массы атома углерода.</p>

       <div class="formula-box">
         A<sub>r</sub>(O) = 16 а.е.м. &nbsp;&nbsp;&nbsp; A<sub>r</sub>(Fe) = 56 а.е.м. &nbsp;&nbsp;&nbsp; A<sub>r</sub>(H) = 1 а.е.м.
       </div>

       <p><span class="key">Молекулярная масса M<sub>r</sub></span> — сумма атомных масс всех атомов в молекуле:</p>

       <div class="formula-box">
         M<sub>r</sub>(H<sub>2</sub>O) = 2 · A<sub>r</sub>(H) + A<sub>r</sub>(O) = 2·1 + 16 = <span class="key">18 а.е.м.</span>
       </div>

       <div class="th-section"><span class="th-num">3</span>Моль и число Авогадро</div>
       <p><span class="key-green">Моль</span> — порция вещества. Как «дюжина» = 12 штук, так «моль» = 6,02 · 10<sup>23</sup> штук.</p>
       <p><span class="key-green">Число Авогадро N<sub>A</sub> = 6,02 · 10<sup>23</sup></span> — столько частиц в одном моле <b>любого</b> вещества. Число огромное, потому что атомы крошечные.</p>
       <p style="text-align:center"><img src="avogadro-number.png" alt="Число Авогадро — 6,02·10²³ частиц в 1 моле" class="theory-img"></p>

       <div class="formula-box">
         N = n · N<sub>A</sub><br>
         <span style="font-size:0.8em;color:#aaa;">N — число молекул, &nbsp; n — количество моль, &nbsp; N<sub>A</sub> = 6,02·10<sup>23</sup></span>
       </div>`,

      // ─── PAGE 3: Молярная масса — «магия» ───
      `<div class="th-section"><span class="th-num">4</span>Молярная масса M — магия таблицы Менделеева</div>
       <p><span class="key">Молярная масса M</span> — масса <b>одного моля</b> вещества в граммах (г/моль).</p>

       <p style="text-align:center"><img src="Молярная масса.png" alt="Молярная масса — вес одного моля" class="theory-img"></p>

       <div class="note-box">
         <span class="note-icon">✨</span> <b>Главный секрет:</b> число в таблице Менделеева — это <span class="key">одновременно</span> и масса одного атома (в а.е.м.), и масса целого моля (в граммах)!
       </div>

       <p>Число в таблице (например, <b>16</b> у Кислорода) отвечает на <b>два вопроса</b> сразу:</p>

       <div class="law-card">
         <div class="law-name" style="color:#00d2ff">Для 1 штуки (атома):</div>
         <div class="law-text">Один атом кислорода весит <b>16 а.е.м.</b> — настолько крошечно, что на весах не увидеть.</div>

let wrongQ = [];
let round = 1;
let idx = 0;
let queueSize = 0;
let roundCorrect = 0;
let shownTheory = new Set();
let selectedTopics = [];
let statsPerTopic = {};
let pendingQ = null;
let _currentQ = null;
let _isRetry = false;
let isAllMode = false;
let _opts = [];
let _correctOrig = 0;

// Theory pagination
let theoryPages = [];
let theoryPageIdx = 0;
let theoryTopicKey = '';

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function emojiBurst(emoji) {
  const el = document.createElement('div');
  el.className = 'emoji-burst';
  el.textContent = emoji;
  el.style.left = (20 + Math.random() * 60) + '%';
  el.style.top = '35%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

// ═══════════════════════════════════════════════════════════════════
// THEORY PAGINATION
// ═══════════════════════════════════════════════════════════════════
function showTheoryForTopic(topicKey) {
  const t = THEORY[topicKey];
  if (!t) return false;
  theoryTopicKey = topicKey;
  theoryPages = t.pages;
  theoryPageIdx = 0;
  document.getElementById('theoryTitle').textContent = t.title;
  renderTheoryPage();
  showScreen('screenTheory');
  return true;
}

function renderTheoryPage() {
  document.getElementById('theoryContent').innerHTML = theoryPages[theoryPageIdx];
  // Dots
  const dotsDiv = document.getElementById('pageDots');
  dotsDiv.innerHTML = theoryPages.map((_, i) =>
    `<div class="page-dot${i === theoryPageIdx ? ' active' : ''}"></div>`
  ).join('');
  // Buttons
  document.getElementById('thPrev').style.visibility = theoryPageIdx === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('thNext');
  if (theoryPageIdx === theoryPages.length - 1) {
    nextBtn.textContent = 'Понял, к вопросам →';
  } else {
    nextBtn.textContent = 'Далее →';
  }
}

function theoryPrev() {
  if (theoryPageIdx > 0) {
    theoryPageIdx--;
    renderTheoryPage();
    window.scrollTo(0, 0);
  }
}

function theoryNext() {
  if (theoryPageIdx < theoryPages.length - 1) {
    theoryPageIdx++;
    renderTheoryPage();
    window.scrollTo(0, 0);
  } else {
    // Done with theory — go to quiz
    skipTheory();
  }
}

// ═══════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════
function goSetup() { showScreen('screenSetup'); }

function startQuiz(topicKey) {
  isAllMode = (topicKey === 'all');
  if (topicKey === 'all') {
    selectedTopics = ['т1', 'т2'];
    queue = shuffle(ALL_Q);
  } else {
    selectedTopics = [topicKey];
    queue = shuffle(ALL_Q.filter(q => q.t === topicKey));
  }
  wrongQ = [];
  round = 1;
  idx = 0;
  queueSize = queue.length;
  roundCorrect = 0;
  shownTheory = new Set();
  statsPerTopic = {};
  selectedTopics.forEach(t => { statsPerTopic[t] = { c: 0, total: 0 }; });
  queue.forEach(q => { if (statsPerTopic[q.t]) statsPerTopic[q.t].total++; });
  showNextQuestion();
}

function startRepeat() {
  const wrongTopics = new Set(wrongQ.map(q => q.t));
  wrongTopics.forEach(t => shownTheory.delete(t));

  queue = shuffle(wrongQ);
  wrongQ = [];
  idx = 0;
  queueSize = queue.length;
  roundCorrect = 0;
  round++;
  showNextQuestion();
}

function restartSame() {
  if (selectedTopics.length > 1) startQuiz('all');
  else startQuiz(selectedTopics[0]);
}

// ═══════════════════════════════════════════════════════════════════
// THEORY FLASH BEFORE QUIZ
// ═══════════════════════════════════════════════════════════════════
function showNextQuestion() {
  if (idx >= queue.length) {
    showResults();
    return;
  }
  const q = queue[idx];

  if (isAllMode) {
    // "Все темы": round 1 — без теории; повтор ошибок — теория перед каждым вопросом
    if (round > 1 && THEORY[q.t]) {
      pendingQ = q;
      showTheoryForTopic(q.t);
      return;
    }
  } else {
    // Отдельная тема: теория один раз в начале (paginated)
    if (!shownTheory.has(q.t) && THEORY[q.t]) {
      shownTheory.add(q.t);
      pendingQ = q;
      showTheoryForTopic(q.t);
      return;
    }
  }
  renderQuestion(q, round > 1);
}

function skipTheory() {
  showScreen('screenQuiz');
  renderQuestion(pendingQ, false);
}

// ═══════════════════════════════════════════════════════════════════
// QUIZ
// ═══════════════════════════════════════════════════════════════════
function renderQuestion(q, isRetry) {
  _currentQ = q;
  _isRetry = !!isRetry;
  showScreen('screenQuiz');

  const pct = Math.round(idx / queueSize * 100);
  document.getElementById('progLabel').textContent = `Вопрос ${idx + 1} из ${queueSize}`;
  document.getElementById('progScore').textContent = `\u2713 ${roundCorrect} \u00b7 \u2717 ${idx - roundCorrect}`;
  document.getElementById('progFill').style.width = pct + '%';

  const tag = document.getElementById('quizTag');
  tag.textContent = TAG_NAMES[q.t];
  tag.className = 'topic-tag ' + TAG_CLASSES[q.t];

  const rb = document.getElementById('roundBadge');
  if (round > 1) { rb.style.display = 'inline-block'; rb.textContent = 'Раунд ' + round; }
  else            { rb.style.display = 'none'; }

  document.getElementById('questionText').innerHTML = q.q;

  _opts = shuffle(q.o.map((text, i) => ({ text, orig: i })));
  _correctOrig = q.c;

  document.getElementById('optionsDiv').innerHTML = _opts.map((opt, i) =>
    `<div class="option" id="opt_${i}" onclick="pickAnswer(${i}, ${opt.orig})">${opt.text}</div>`
  ).join('');

  const expl = document.getElementById('explanation');
  expl.style.display = 'none';
  expl.innerHTML = q.e;
  document.getElementById('nextBtnWrap').style.display = 'none';

  const isLast = (idx === queueSize - 1);
  document.getElementById('nextBtn').textContent = isLast ? 'Результаты \u2192' : 'Следующий \u2192';
}

function pickAnswer(displayIdx, origIdx) {
  const q = queue[idx];
  document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));

  const isCorrect = (origIdx === _correctOrig);

  _opts.forEach((opt, i) => {
    const el = document.getElementById('opt_' + i);
    if (opt.orig === _correctOrig) el.classList.add('correct');
    if (i === displayIdx && !isCorrect) el.classList.add('wrong');
  });

  if (isCorrect) {
    roundCorrect++;
    if (statsPerTopic[q.t]) statsPerTopic[q.t].c++;
    emojiBurst(['🎉','✨','🔥','⚡'][Math.floor(Math.random()*4)]);
  } else {
    wrongQ.push(q);
  }

  document.getElementById('explanation').style.display = 'block';
  document.getElementById('nextBtnWrap').style.display = 'flex';
}

function nextQuestion() {
  idx++;
  showNextQuestion();
}

// ═══════════════════════════════════════════════════════════════════
// RESULTS
// ═══════════════════════════════════════════════════════════════════
function showResults() {
  showScreen('screenResults');
  const total = queueSize;
  const correct = roundCorrect;
  const pct = Math.round(correct / total * 100);

  let grade, cls;
  if (pct >= 80)      { grade = 'Отлично!'; cls = 'score-great'; }
  else if (pct >= 50) { grade = 'Неплохо!'; cls = 'score-ok'; }
  else                { grade = 'Надо повторить'; cls = 'score-bad'; }

  document.getElementById('resultsGrade').textContent = grade;
  const sc = document.getElementById('scoreCircle');
  sc.textContent = pct + '%';
  sc.className = 'score-circle ' + cls;
  document.getElementById('resultsSub').textContent = `${correct} из ${total} правильно (раунд ${round})`;

  // Topic stats
  let statsHTML = '';
  for (const t of selectedTopics) {
    const s = statsPerTopic[t];
    if (!s || s.total === 0) continue;
    const p = Math.round(s.c / s.total * 100);
    const color = TOPIC_COLORS[t] || '#ccc';
    statsHTML += `
      <div class="topic-stat">
        <span class="ts-label">${TAG_NAMES[t]}</span>
        <div class="ts-bar"><div class="ts-fill" style="width:${p}%;background:${color}"></div></div>
        <span class="ts-num">${s.c}/${s.total}</span>
      </div>`;
  }
  document.getElementById('topicStats').innerHTML = statsHTML;

  // Repeat button
  const btnRepeat = document.getElementById('btnRepeat');
  if (wrongQ.length > 0) {
    btnRepeat.style.display = 'inline-block';
    document.getElementById('wrongCount').textContent = wrongQ.length;
  } else {
    btnRepeat.style.display = 'none';
  }
}
</script>
</body>
</html>
